services:
  postgres:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: pulso
      POSTGRES_USER: pulso
      POSTGRES_PASSWORD: pulso
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pulso -d pulso']
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - pulso-postgres:/var/lib/postgresql

volumes:
  pulso-postgres:
