name: Ingestion

on:
  schedule:
    # Run at 10:00 and 20:00 every day (Events)
    - cron: '0 10,20 * * *'
    # Run at 00:00 every Monday (Venues)
    - cron: '0 0 * * 1'
    # Run at 01:00 on Tuesday, Thursday, and Saturday (Eventbrite - billed
    # per result, kept on its own job so it never runs alongside the free
    # connectors in the twice-daily events job). ~12-13 runs/month at this
    # cadence (not a strict 10/month cap - cron can't enforce a monthly
    # count natively), chosen to leave Apify budget for the upcoming
    # Instagram scraper workstream. Revisit cadence/cost once real signal
    # exists - see DATA-0003.
    - cron: '0 1 * * 2,4,6'
    # Run at 02:00 on Tuesday, Thursday, and Saturday (Instagram Scout -
    # free Meta Graph API quota, but kept on the same reduced cadence as
    # Eventbrite for now since the pipeline is still a supervised pilot,
    # not a proven high-frequency job; see DEC-0006). Produces a
    # human-review HTML artifact, never publishes on its own.
    - cron: '0 2 * * 2,4,6'
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Job to run (events, venues, eventbrite, or instagram-scout)'
        required: true
        default: 'events'
        type: choice
        options:
          - events
          - venues
          - eventbrite
          - instagram-scout

jobs:
  ingest-events:
    name: Run Events Ingestion
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 10,20 * * *' || github.event.inputs.job_type == 'events'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm run build --filter="@pulso/database..."
      - name: Run Events Ingestion
        run: pnpm run --filter=@pulso/database db:ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PARSE_BOT_API_KEY: ${{ secrets.PARSE_BOT_API_KEY }}

  ingest-venues:
    name: Run Venues Ingestion
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * 1' || github.event.inputs.job_type == 'venues'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm run build --filter="@pulso/database..."
      - name: Run Venues Ingestion
        run: pnpm run --filter=@pulso/database db:ingest -- --venues
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PARSE_BOT_API_KEY: ${{ secrets.PARSE_BOT_API_KEY }}

  ingest-eventbrite:
    name: Run Eventbrite Ingestion
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 1 * * 2,4,6' || github.event.inputs.job_type == 'eventbrite'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm run build --filter="@pulso/database..."
      - name: Run Eventbrite Ingestion
        run: pnpm run --filter=@pulso/database db:ingest -- --eventbrite
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}

  ingest-instagram-scout:
    name: Run Instagram Scout Pipeline
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 2 * * 2,4,6' || github.event.inputs.job_type == 'instagram-scout'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm run build --filter="@pulso/database..."
      - name: Run Instagram Scout pipeline
        run: pnpm run --filter=@pulso/database instagram:scout:pipeline
        env:
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      - name: Upload review HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-scout-review
          path: packages/database/ingestion-output/instagram-scout-review.html
          retention-days: 14
