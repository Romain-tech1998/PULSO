name: Ingestion

on:
  schedule:
    # Run at 10:00 and 20:00 every day (Events, free sources only: Ville de
    # Montréal open data + Ticketmaster Discovery).
    #
    # This is the only schedule left. Every connector billed per call or per
    # result - Parse.bot, Apify (Eventbrite, Instagram Stories), OpenRouter
    # vision - was taken off the clock on 2026-10-14 at the owner's request:
    # they get reworked in a dedicated session so that one ingestion is one
    # traced set of calls, not hundreds per run. Until then the jobs below
    # that use them run only when dispatched by hand. Their former cadence
    # and the reasoning behind it are in DATA-0003.
    - cron: '0 10,20 * * *'
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Job to run (census, events, venues, eventbrite, instagram-feed, or instagram-stories)'
        required: true
        default: 'events'
        type: choice
        options:
          - census
          - events
          - venues
          - eventbrite
          - instagram-feed
          - instagram-stories

jobs:
  census:
    name: Database Census (read-only)
    runs-on: ubuntu-latest
    if: github.event.inputs.job_type == 'census'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm --filter "@pulso/database..." run build
      - name: Count what the database holds
        run: pnpm run --filter=@pulso/database db:census
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  ingest-events:
    name: Run Events Ingestion
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 10,20 * * *' || github.event.inputs.job_type == 'events'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm --filter "@pulso/database..." run build
      - name: Apply database migrations
        # The schema the ingestion is about to write into has to be the one
        # this checkout expects. Without this the database drifted behind
        # the repository indefinitely, and every Eventbrite run failed on
        # `invalid input value for enum event_category: "sport"` - migration
        # 0040 added that value months ago and nothing ever applied it here.
        # The migrator is tracked and idempotent, so this is a no-op once
        # the database is current.
        run: pnpm run --filter=@pulso/database db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Run Events Ingestion
        # Free sources only. PARSE_BOT_API_KEY is deliberately not passed:
        # ingest.ts skips any connector whose key is unset.
        run: pnpm run --filter=@pulso/database db:ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      - name: Count what the database holds
        run: pnpm run --filter=@pulso/database db:census
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  ingest-venues:
    name: Run Venues Ingestion
    runs-on: ubuntu-latest
    if: github.event.inputs.job_type == 'venues'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm --filter "@pulso/database..." run build
      - name: Apply database migrations
        # The schema the ingestion is about to write into has to be the one
        # this checkout expects. Without this the database drifted behind
        # the repository indefinitely, and every Eventbrite run failed on
        # `invalid input value for enum event_category: "sport"` - migration
        # 0040 added that value months ago and nothing ever applied it here.
        # The migrator is tracked and idempotent, so this is a no-op once
        # the database is current.
        run: pnpm run --filter=@pulso/database db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # The venue directory is built from free sources: OpenStreetMap via
      # Overpass, Nominatim for missing addresses (1 req/s), then the
      # hand-verified venues and categories kept in this repository. Manual
      # only - Overpass and Nominatim are volunteer-run and ask for moderate
      # use, and venues change slowly. The Parse.bot RA clubs connector
      # (`db:ingest -- --venues`) is paid and waits for the rework.
      - name: Import venues from OpenStreetMap
        run: pnpm run --filter=@pulso/database db:import-osm-venues -- --write
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Seed hand-verified venues
        run: pnpm run --filter=@pulso/database db:seed-curated-venues
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Categorize known venues
        run: pnpm run --filter=@pulso/database db:categorize-known-venues
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Count what the database holds
        run: pnpm run --filter=@pulso/database db:census
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  ingest-eventbrite:
    name: Run Eventbrite Ingestion
    runs-on: ubuntu-latest
    # Billed per result: manual only until the dedicated rework.
    if: github.event.inputs.job_type == 'eventbrite'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm --filter "@pulso/database..." run build
      - name: Apply database migrations
        # The schema the ingestion is about to write into has to be the one
        # this checkout expects. Without this the database drifted behind
        # the repository indefinitely, and every Eventbrite run failed on
        # `invalid input value for enum event_category: "sport"` - migration
        # 0040 added that value months ago and nothing ever applied it here.
        # The migrator is tracked and idempotent, so this is a no-op once
        # the database is current.
        run: pnpm run --filter=@pulso/database db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Run Eventbrite Ingestion
        run: pnpm run --filter=@pulso/database db:ingest -- --eventbrite
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}

  ingest-instagram-feed:
    name: Run Instagram Feed Pipeline
    runs-on: ubuntu-latest
    # OpenRouter vision is billed per call: manual only until the rework.
    if: github.event.inputs.job_type == 'instagram-feed'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm --filter "@pulso/database..." run build
      - name: Run Instagram Feed pipeline
        run: pnpm run --filter=@pulso/database instagram:unified:pipeline:feed
        env:
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Upload review HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-feed-review
          path: packages/database/ingestion-output/instagram-unified-review.html
          retention-days: 14

  ingest-instagram-stories:
    name: Run Instagram Stories Pipeline
    runs-on: ubuntu-latest
    # Apify + OpenRouter, billed per call: manual only until the rework.
    if: github.event.inputs.job_type == 'instagram-stories'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm --filter "@pulso/database..." run build
      - name: Run Instagram Stories pipeline
        run: pnpm run --filter=@pulso/database instagram:unified:pipeline:stories
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Upload review HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-stories-review
          path: packages/database/ingestion-output/instagram-unified-review.html
          retention-days: 14
