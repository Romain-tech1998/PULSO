name: Ingestion

on:
  schedule:
    # Run at 10:00 and 20:00 every day (Events)
    - cron: '0 10,20 * * *'
    # Run at 00:00 every Monday (Venues)
    - cron: '0 0 * * 1'
    # Run at 01:00 on Tuesday, Thursday, and Saturday (Eventbrite - billed
    # per result, kept on its own job so it never runs alongside the free
    # connectors in the twice-daily events job). ~12-13 runs/month at this
    # cadence (not a strict 10/month cap - cron can't enforce a monthly
    # count natively), chosen to leave Apify budget for the upcoming
    # Instagram scraper workstream. Revisit cadence/cost once real signal
    # exists - see DATA-0003.
    - cron: '0 1 * * 2,4,6'
    # Run at 03:00 every Monday (Instagram Feed/Reels pilot). Feed posts
    # are static once published - a daily vision-model scan of the same
    # ~220 posts wastes OpenRouter budget for no new signal, so this only
    # runs weekly. Reduced from a daily unified run after early results
    # weren't significant enough to justify the cost - see instagram-
    # unified-pilot.ts's --feed-only flag.
    - cron: '0 3 * * 1'
    # Run at 03:00 on Thursday, Friday, and Saturday (Instagram Stories
    # pilot). Stories genuinely change day to day (24h expiry, unlike
    # Feed), so they keep a tighter, weekend-focused cadence when nightlife
    # activity is highest - see instagram-unified-pilot.ts's
    # --stories-only flag.
    - cron: '0 3 * * 4,5,6'
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Job to run (events, venues, eventbrite, instagram-feed, or instagram-stories)'
        required: true
        default: 'events'
        type: choice
        options:
          - events
          - venues
          - eventbrite
          - instagram-feed
          - instagram-stories

jobs:
  ingest-events:
    name: Run Events Ingestion
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 10,20 * * *' || github.event.inputs.job_type == 'events'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm --filter "@pulso/database..." run build
      - name: Run Events Ingestion
        run: pnpm run --filter=@pulso/database db:ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PARSE_BOT_API_KEY: ${{ secrets.PARSE_BOT_API_KEY }}

  ingest-venues:
    name: Run Venues Ingestion
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 0 * * 1' || github.event.inputs.job_type == 'venues'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm --filter "@pulso/database..." run build
      - name: Run Venues Ingestion
        run: pnpm run --filter=@pulso/database db:ingest -- --venues
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PARSE_BOT_API_KEY: ${{ secrets.PARSE_BOT_API_KEY }}

  ingest-eventbrite:
    name: Run Eventbrite Ingestion
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 1 * * 2,4,6' || github.event.inputs.job_type == 'eventbrite'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm --filter "@pulso/database..." run build
      - name: Run Eventbrite Ingestion
        run: pnpm run --filter=@pulso/database db:ingest -- --eventbrite
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}

  ingest-instagram-feed:
    name: Run Instagram Feed Pipeline (weekly)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * 1' || github.event.inputs.job_type == 'instagram-feed'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm --filter "@pulso/database..." run build
      - name: Run Instagram Feed pipeline
        run: pnpm run --filter=@pulso/database instagram:unified:pipeline:feed
        env:
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Upload review HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-feed-review
          path: packages/database/ingestion-output/instagram-unified-review.html
          retention-days: 14

  ingest-instagram-stories:
    name: Run Instagram Stories Pipeline (Thu/Fri/Sat)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * 4,5,6' || github.event.inputs.job_type == 'instagram-stories'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11.7.0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Build packages
        run: pnpm --filter "@pulso/database..." run build
      - name: Run Instagram Stories pipeline
        run: pnpm run --filter=@pulso/database instagram:unified:pipeline:stories
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - name: Upload review HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-stories-review
          path: packages/database/ingestion-output/instagram-unified-review.html
          retention-days: 14
